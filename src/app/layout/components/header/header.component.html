<header class="sticky top-0 z-50 w-full backdrop-blur-md bg-surface-0/70 dark:bg-surface-900/70 border-b border-surface-200 dark:border-surface-800 px-4 py-3 flex justify-between items-center transition-colors duration-300">

    <!-- Groupe Gauche : Menu (et futur Breadcrumb) -->
    <div class="flex items-center gap-4">
        <!-- Bouton Menu Hamburger -->
        <button (click)="toggleSidebar.emit()" class="p-2 rounded-xl hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors text-surface-600 dark:text-surface-300 cursor-pointer flex items-center justify-center">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <!-- Emplacement réservé pour le futur BreadcrumbComponent -->
    </div>

    <!-- Groupe Droite : Profil et Actions -->
    <div class="flex items-center gap-4">

        <!-- Badge Rôle dynamique déplacé à droite -->
        <div class="hidden md:block">
            @if (user()) {
                <p-chip
                    class="px-3 py-1 rounded-full bg-primary-500/10 border border-primary-500/30 text-primary-700 dark:text-primary-300 backdrop-blur-md shadow-sm font-medium text-sm">
                    {{ user()?.firstname }} {{ user()?.lastname }}
                    <span class="opacity-60 text-[10px] tracking-wider font-bold ml-1 uppercase">({{ user()?.role }})</span>
                </p-chip>
            }
        </div>

        <!-- Bouton Logout -->
        <button (click)="logout()" class="p-2 rounded-xl hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors text-surface-500 hover:text-primary-500 cursor-pointer flex items-center justify-center" title="Se déconnecter">
            <span class="material-symbols-outlined">logout</span>
        </button>
    </div>
</header>
