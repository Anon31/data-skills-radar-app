<div class="p-3 border-t border-surface-200/50 dark:border-surface-800/50">
    <div class="flex items-center gap-3 p-2 rounded-xl bg-surface-100/50 dark:bg-surface-800/50 border border-surface-200 dark:border-surface-700 hover:border-primary-500/50 transition-colors duration-300 overflow-hidden cursor-pointer">

        <!-- Avatar avec initiales calculées -->
        <div class="w-10 h-10 flex-shrink-0 rounded-lg border border-primary-500 bg-surface-0 dark:bg-surface-900 flex items-center justify-center shadow-sm">
            <span class="text-sm font-bold text-primary-500">{{ initials() }}</span>
        </div>

        <!-- Infos dynamiques -->
        <div class="flex flex-col flex-1 transition-opacity duration-300 whitespace-nowrap"
             [class.opacity-100]="isOpen()"
             [class.opacity-0]="!isOpen()">
            <span class="text-sm font-bold text-surface-900 dark:text-surface-0 leading-tight">{{ fullName() }}</span>
            <span class="text-[10px] uppercase tracking-wider text-surface-500 font-medium mt-0.5">{{ roleLabel() }}</span>
        </div>

    </div>
</div>
