<div class="p-3 sidebar-user-wrapper">
    <div
        [routerLink]="canAccessAccount() ? '/mon-compte' : null"
        [attr.title]="canAccessAccount() ? 'Accéder à mon compte' : null"
        [class.cursor-pointer]="canAccessAccount()"
        [ngClass]="{'hover:border-primary-500/50': canAccessAccount()}"
        class="flex items-center gap-3 p-2 rounded-xl bg-surface-100/50 dark:bg-surface-800/50 border border-surface-200 dark:border-surface-700 transition-colors duration-300 overflow-hidden">

        <!-- Avatar avec initiales calculées -->
        <div class="sidebar-user-avatar w-10 h-10 shrink-0 rounded-lg border border-primary-500 flex items-center justify-center shadow-sm">
            <span class="text-sm font-bold text-primary-500">{{ initials() }}</span>
        </div>

        <!-- Infos dynamiques -->
        <div class="flex flex-col flex-1 transition-opacity duration-300 whitespace-nowrap"
             [class.opacity-100]="isOpen()"
             [class.opacity-0]="!isOpen()">
            <span class="sidebar-user-name text-sm font-bold leading-tight">{{ fullName() }}</span>
            <span class="text-[10px] uppercase tracking-wider text-surface-500 font-medium mt-0.5">{{ roleLabel() }}</span>
        </div>

    </div>
</div>
