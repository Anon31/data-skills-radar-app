<div class="flex flex-col gap-6">
    @for (category of categories(); track category.title) {
        <div class="flex flex-col gap-2">

            <!-- Titre de la catégorie (ex: GÉNÉRAL) -->
            <div class="px-2 h-6 flex items-center overflow-hidden">
                <span class="text-xs font-bold uppercase tracking-widest text-surface-400 dark:text-surface-500 transition-opacity duration-300 whitespace-nowrap"
                      [class.opacity-100]="isOpen()"
                      [class.opacity-0]="!isOpen()">
                    {{ category.title }}
                </span>
            </div>

            <!-- Liens de la catégorie -->
            @for (item of category.items; track item.id) {
                <a [routerLink]="item.route"
                   routerLinkActive="font-bold text-primary-600 dark:text-primary-400 bg-gradient-to-r from-primary-500/20 to-primary-500/5 border border-primary-500/40 scale-[1.02] translate-x-1 shadow-[0_0_15px_-3px_rgba(var(--p-primary-500),0.2)]"
                   class="flex items-center gap-4 px-3 py-3 rounded-xl transition-all duration-300 text-surface-600 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-surface-800 group relative border border-transparent"
                   [title]="!isOpen() ? item.label : ''">

                    <span class="material-symbols-outlined flex-shrink-0 group-hover:scale-110 transition-transform duration-300">
                        {{ item.icon }}
                    </span>

                    <span class="font-medium whitespace-nowrap transition-opacity duration-300"
                          [class.opacity-100]="isOpen()"
                          [class.opacity-0]="!isOpen()">
                        {{ item.label }}
                    </span>
                </a>
            }
        </div>
    }
</div>
