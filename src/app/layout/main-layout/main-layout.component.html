<!-- Le conteneur principal bloque le scroll global pour laisser le main scroller -->
<div class="flex h-screen w-full overflow-hidden bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-0 transition-colors duration-300">
    <!-- La Sidebar (Gère sa propre largeur) -->
    <app-sidebar class="flex-none z-20"></app-sidebar>
    <!-- La partie droite (Header + Contenu + Footer) -->
    <div class="flex flex-col flex-1 min-w-0 relative transition-all duration-300">
        <app-header class="flex-none z-10"></app-header>
        <!-- Le main prend l'espace restant et gère son propre scroll -->
        <main class="flex-1 overflow-y-auto scroll-smooth p-6">
            <router-outlet></router-outlet>
        </main>
        <app-footer class="flex-none mt-auto"></app-footer>
    </div>
</div>
