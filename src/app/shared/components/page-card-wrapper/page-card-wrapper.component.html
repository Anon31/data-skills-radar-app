<p-card styleClass="h-full rounded-2xl border transition-colors duration-300 bg-surface-0 dark:bg-surface-900 border-surface-200 dark:border-surface-700 shadow-sm">

    <!-- HEADER DE PAGE -->
    @if (title()) {
        <div class="mb-5">
            <div class="flex flex-col items-start gap-1">
                <div class="flex items-center gap-3">
                    @if (icon()) {
                        <div class="flex items-center justify-center w-9 h-9 flex-shrink-0 rounded-lg bg-primary/10 border border-primary/20 shadow-sm">
                            <span class="material-symbols-outlined text-primary text-[20px]">
                                {{ icon() }}
                            </span>
                        </div>
                    }
                    <!-- Titre en text-primary -->
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight text-primary m-0 font-space-grotesk">
                        {{ title() }}
                    </h1>
                </div>
                @if (subtitle()) {
                    <p class="text-surface-500 text-sm mt-1 font-medium tracking-wide m-0 pl-[3rem]">
                        {{ subtitle() }}
                    </p>
                }
            </div>
            @if (!hideDivider()) {
                <p-divider class="my-4 before:border-t-surface-200 dark:before:border-t-surface-800"></p-divider>
            }
        </div>
    }

    <!-- CONTENT DE PAGE -->
    <ng-content></ng-content>
</p-card>
