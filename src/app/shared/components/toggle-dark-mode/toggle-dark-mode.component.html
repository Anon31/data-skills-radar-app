<button
    pButton
    rounded
    severity="secondary"
    class="fixed bottom-6 right-6 z-[1000] w-14 h-14 flex items-center justify-center shadow-2xl backdrop-blur-md bg-surface-0/80 dark:bg-surface-800/80 border border-surface-200/50 dark:border-surface-700/50 transition-transform duration-300 hover:scale-110"
    aria-label="Basculer le thème"
    (click)="sessionService.toggleTheme()">

    <span class="material-symbols-outlined text-2xl text-surface-900 dark:text-surface-0">
        {{ sessionService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
    </span>
</button>
